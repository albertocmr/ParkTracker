services:

  backend:
    build:
      context: ./TFG_backend  # Ruta a la carpeta donde está el Dockerfile del backend
    ports:
      - "8080:8080"  # Exponer el puerto 8080
    networks:
      - app-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/parktrackerdb?allowPublicKeyRetrieval=true&useSSL=false  # Conexión a MySQL
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://localhost:8001
      # La imagen no incluye application.properties: la configuración llega por entorno
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 10MB
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./TFG_frontend
    ports:
      - "8001:8001"
    networks:
      - app-network
    environment:
      # La llamada la hace el navegador, por eso es localhost y no el nombre del servicio
      PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: parktrackerdb
    ports:
      - "127.0.0.1:3306:3306"  # Solo accesible desde esta máquina
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]  # por TCP: durante la inicialización MySQL solo escucha en el socket
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
