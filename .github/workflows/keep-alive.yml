# Evita que el backend del plan gratuito de Render se duerma tras 15 minutos sin tráfico.
# Solo actúa si existe la variable de repositorio BACKEND_URL (Settings → Secrets and variables → Actions → Variables),
# p. ej. https://parktracker-backend.onrender.com
name: Mantener despierto el backend

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# El job solo hace una petición HTTP: no necesita ningún permiso sobre el repositorio
permissions: {}

jobs:
  ping:
    if: ${{ vars.BACKEND_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping al backend
        # La URL se pasa por entorno y no interpolada en el script, para que su valor no pueda inyectar comandos
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: curl --silent --show-error --fail --max-time 180 --retry 2 "$BACKEND_URL/api/perimeters" -o /dev/null
